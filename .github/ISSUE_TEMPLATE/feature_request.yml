name: 기능 요청
description: 새로운 기능을 제안할 때 사용하세요
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "기능 요청을 작성해주셔서 감사합니다."
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하고 싶나요?
      description: 현재 불편한 점이나 해결하고 싶은 문제를 설명해주세요
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 원하는 기능
      description: 어떤 기능이 추가되었으면 좋겠나요?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려해본 다른 방법이 있나요?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 기능 요청과 관련된 추가 정보가 있다면 적어주세요
    validations:
      required: false
