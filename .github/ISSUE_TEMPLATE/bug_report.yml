name: 버그 리포트
description: 버그를 발견했을 때 사용하세요
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "버그 리포트를 작성해주셔서 감사합니다."
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 버그인지 설명해주세요
      placeholder: 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 방법을 단계별로 적어주세요
      placeholder: |
        1. '...'에 접속
        2. '...'을 클릭
        3. '...'을 스크롤
        4. 에러 발생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 어떻게 동작해야 한다고 생각하나요?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷
      description: 가능하다면 스크린샷을 첨부해주세요
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 앱 버전
      description: 사용 중인 앱 버전 (설정에서 확인 가능)
      placeholder: "예: v0.2.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: "예: Windows 11"
    validations:
      required: true
